<button class="entry" data-act="4" data-search="トウモロコシ 新しい土地の種 结尾回顾第二幕拾取玉米" data-src="第4幕/4-20_トウモロコシ.png" aria-label="查看トウモロコシ"><span class="id">4-20</span><span><b>トウモロコシ</b><small>新しい土地の種 · 结尾回顾第二幕拾取玉米</small></span><span class="arrow">›</span></button></div></div><dialog id="viewer"><div class="viewer"><img id="card" alt="調査カード"><div class="controls"><button id="prev">上一张</button><span class="view-label" id="label"></span><button id="next">下一张</button><button id="close">关闭</button></div></div></dialog><script>
const rows=[...document.querySelectorAll('.entry')], tabs=[...document.querySelectorAll('.tab')];let act=0,view=0,visible=[];let search=document.getElementById('search'),dlg=document.getElementById('viewer'),im=document.getElementById('card'),lab=document.getElementById('label');function refresh(){let q=search.value.trim().toLowerCase();visible=rows.filter(r=>{let ok=(!act||r.dataset.act==act)&&r.dataset.search.toLowerCase().includes(q);r.classList.toggle('hidden',!ok);return ok})}search.addEventListener('input',refresh);tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.toggle('active',x==t));act=Number(t.dataset.act);refresh()}));function show(i){if(!visible.length)return;view=(i+visible.length)%visible.length;im.src=visible[view].dataset.src;lab.textContent=visible[view].querySelector('.id').textContent}rows.forEach(r=>r.addEventListener('click',()=>{refresh();show(visible.indexOf(r));dlg.showModal()}));document.getElementById('prev').addEventListener('click',()=>show(view-1));document.getElementById('next').addEventListener('click',()=>show(view+1));document.getElementById('close').addEventListener('click',()=>dlg.close());document.addEventListener('keydown',e=>{if(dlg.open){if(e.key==='ArrowLeft')show(view-1);if(e.key==='ArrowRight')show(view+1)}});refresh();</script></body></html>
